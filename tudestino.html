<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuDestino - Calculadora de Número de Vida</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0d1a2a 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(20, 30, 45, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.2);
            border: 1px solid rgba(212,175,55,0.3);
        }
        .druid-placeholder {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #2a3a4a, #1a2a3a);
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d4af37;
            font-size: 50px;
        }
        h1 {
            text-align: center;
            color: #d4af37;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #aac8e0;
            font-size: 14px;
            margin-bottom: 25px;
            font-style: italic;
        }
        .selector {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .selector label {
            color: #d4af37;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .selector input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #d4af37;
        }
        .date-fields {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .date-field {
            flex: 1;
            min-width: 80px;
            text-align: center;
        }
        .date-field label {
            display: block;
            color: #d4af37;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .date-field input {
            width: 100%;
            padding: 12px 10px;
            font-size: 20px;
            text-align: center;
            background: rgba(10, 20, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 15px;
            color: white;
            font-family: monospace;
            font-weight: bold;
        }
        .pair-fields {
            display: none;
        }
        .pair-fields.show {
            display: block;
        }
        .result-container {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            margin-bottom: 25px;
        }
        .result-label {
            color: #aac8e0;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .result-number {
            font-size: 56px;
            font-weight: bold;
            color: #d4af37;
        }
        .result-name {
            font-size: 18px;
            color: white;
            margin-top: 8px;
        }
        .audio-container {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            display: none;
        }
        .audio-container.show {
            display: block;
        }
        .audio-title {
            color: #d4af37;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }
        .buy-button {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #b8922a);
            color: #0a0f1e;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            margin-top: 20px;
        }
        .info-text {
            text-align: center;
            color: #6a8aaa;
            font-size: 11px;
            margin-top: 15px;
        }
        iframe {
            width: 100%;
            height: 100px;
            border-radius: 12px;
            border: none;
        }
        .limit-message {
            text-align: center;
            color: #d4af37;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="druid-placeholder">🧙‍♂️</div>
    <h1>✦ TUDESTINO ✦</h1>
    <div class="subtitle">¿Qué número de vida eres?</div>

    <div class="selector">
        <label><input type="radio" name="tipo" value="individual" checked> 👤 Individual</label>
        <label><input type="radio" name="tipo" value="pareja"> 💑 Pareja</label>
    </div>

    <div id="individualFields" class="date-fields">
        <div class="date-field"><label>DÍA</label><input type="text" id="day" placeholder="DD" maxlength="2"></div>
        <div class="date-field"><label>MES</label><input type="text" id="month" placeholder="MM" maxlength="2"></div>
        <div class="date-field"><label>AÑO</label><input type="text" id="year" placeholder="YYYY" maxlength="4"></div>
    </div>

    <div id="pairFields" class="pair-fields">
        <div class="date-fields">
            <div class="date-field"><label>DÍA (Tú)</label><input type="text" id="day1" placeholder="DD" maxlength="2"></div>
            <div class="date-field"><label>MES (Tú)</label><input type="text" id="month1" placeholder="MM" maxlength="2"></div>
            <div class="date-field"><label>AÑO (Tú)</label><input type="text" id="year1" placeholder="YYYY" maxlength="4"></div>
        </div>
        <div class="date-fields">
            <div class="date-field"><label>DÍA (Pareja)</label><input type="text" id="day2" placeholder="DD" maxlength="2"></div>
            <div class="date-field"><label>MES (Pareja)</label><input type="text" id="month2" placeholder="MM" maxlength="2"></div>
            <div class="date-field"><label>AÑO (Pareja)</label><input type="text" id="year2" placeholder="YYYY" maxlength="4"></div>
        </div>
    </div>

    <div class="result-container">
        <div class="result-label" id="resultLabel">TU DESTINO</div>
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-name" id="resultName">Introduce tu fecha</div>
    </div>

    <div id="audioContainer" class="audio-container">
        <div class="audio-title" id="audioTitle">🔮 AUDIO COMPLETO 🔮</div>
        <div id="playerFrame"></div>
        <div id="limitMessage" class="limit-message"></div>
    </div>

    <a href="#" id="buyLink" class="buy-button" target="_blank">
        🔮 COMPRAR AUDIO COMPLETO POR 2€ 🔮
    </a>
    
    <div class="info-text">Tu número se calcula automáticamente al escribir tu fecha completa</div>
</div>

<script>
    // ENLACES DE SOUNDCLOUD
    const audioLinksIndividual = {
        1: "https://soundcloud.com/jaume-674558592/1x-1",
        2: "https://soundcloud.com/jaume-674558592/2x-2",
        3: "https://soundcloud.com/jaume-674558592/3x-3",
        4: "https://soundcloud.com/jaume-674558592/4x-4",
        5: "https://soundcloud.com/jaume-674558592/5x-5",
        6: "https://soundcloud.com/jaume-674558592/6x-6",
        7: "https://soundcloud.com/jaume-674558592/7x-7",
        8: "https://soundcloud.com/jaume-674558592/8x-8",
        9: "https://soundcloud.com/jaume-674558592/9x-9"
    };
    const audioLinksPareja = {
        1: "https://soundcloud.com/jaume-674558592/p-1-1",
        2: "https://soundcloud.com/jaume-674558592/p-2-2",
        3: "https://soundcloud.com/jaume-674558592/p-3-3",
        4: "https://soundcloud.com/jaume-674558592/p-4-4",
        5: "https://soundcloud.com/jaume-674558592/p-5-5",
        6: "https://soundcloud.com/jaume-674558592/p-6-6",
        7: "https://soundcloud.com/jaume-674558592/p-7-7",
        8: "https://soundcloud.com/jaume-674558592/p-8-8",
        9: "https://soundcloud.com/jaume-674558592/p-9-9"
    };

    const numberNames = {
        1: "El Iniciador",
        2: "El Conciliador",
        3: "El Comunicador",
        4: "El Constructor",
        5: "El Aventurero",
        6: "El Cuidador",
        7: "El Buscador",
        8: "El Realizador",
        9: "El Humanitario"
    };
    
    const pairNames = {
        1: "Aprendéis a liderar sin competir",
        2: "Aprendéis a comunicar sin heriros",
        3: "Aprendéis a divertiros sin evitar los problemas",
        4: "Aprendéis a construir sin odiar la rutina",
        5: "Aprendéis a daros libertad sin perder el vínculo",
        6: "Aprendéis a cuidaros sin agobiaros",
        7: "Aprendéis a respetar el silencio del otro",
        8: "Aprendéis a gestionar el dinero sin peleas",
        9: "Aprendéis a soltar el pasado juntos"
    };

    // ========== ENLACES DE PAGO ==========
    const GUMROAD_INDIVIDUAL = "https://ko-fi.com/s/1239d6ca65";
    const GUMROAD_PAREJA = "https://ko-fi.com/s/1239d6ca65";
    // =====================================

    const urlParams = new URLSearchParams(window.location.search);
    const isPaid = urlParams.get('pagado') === '1';

    let currentAudioKey = null;
    let currentAudioUrl = null;

    const radioIndividual = document.querySelector('input[value="individual"]');
    const radioPareja = document.querySelector('input[value="pareja"]');
    const individualFields = document.getElementById('individualFields');
    const pairFields = document.getElementById('pairFields');
    const resultNumberSpan = document.getElementById('resultNumber');
    const resultNameSpan = document.getElementById('resultName');
    const resultLabel = document.getElementById('resultLabel');
    const audioContainer = document.getElementById('audioContainer');
    const playerFrame = document.getElementById('playerFrame');
    const audioTitle = document.getElementById('audioTitle');
    const buyLink = document.getElementById('buyLink');
    const limitMessageDiv = document.getElementById('limitMessage');

    const dayInput = document.getElementById('day');
    const monthInput = document.getElementById('month');
    const yearInput = document.getElementById('year');
    const day1Input = document.getElementById('day1');
    const month1Input = document.getElementById('month1');
    const year1Input = document.getElementById('year1');
    const day2Input = document.getElementById('day2');
    const month2Input = document.getElementById('month2');
    const year2Input = document.getElementById('year2');

    let currentType = 'individual';
    let currentNumber = null;

    function reduceToMaster(n) { 
        if (n === 11 || n === 22 || n === 33) return n; 
        while (n > 9) {
            let s = 0; 
            n.toString().split('').forEach(d => s += parseInt(d)); 
            n = s;
        } 
        return n; 
    }
    
    function calculateLifeNumber(d, m, y) { 
        let rd = reduceToMaster(d), rm = reduceToMaster(m), ry = reduceToMaster(y); 
        return reduceToMaster(rd + rm + ry); 
    }
    
    function onlyNumbers(input) { 
        input.value = input.value.replace(/[^0-9]/g, ''); 
    }
    
    function validateDate(d, m, y) { 
        if (d < 1 || d > 31 || m < 1 || m > 12 || y < 1000 || y > 2100) return false; 
        const dim = new Date(y, m, 0).getDate(); 
        return d <= dim; 
    }

    function getPlayCount(key) { 
        return parseInt(localStorage.getItem(key) || '0'); 
    }
    
    function incrementPlayCount(key) { 
        localStorage.setItem(key, getPlayCount(key) + 1); 
    }
    
    function canPlay(key) { 
        return getPlayCount(key) < 3; 
    }
    
    function getRemainingPlays(key) { 
        return 3 - getPlayCount(key); 
    }

    function updateBuyButton() {
        if (currentType === 'individual') {
            buyLink.href = GUMROAD_INDIVIDUAL;
            currentAudioKey = `playcount_individual_${currentNumber}`;
            if (audioLinksIndividual[currentNumber]) currentAudioUrl = audioLinksIndividual[currentNumber];
        } else {
            buyLink.href = GUMROAD_PAREJA;
            currentAudioKey = `playcount_pareja_${currentNumber}`;
            if (audioLinksPareja[currentNumber]) currentAudioUrl = audioLinksPareja[currentNumber];
        }
        buyLink.style.display = 'block';
        
        if (isPaid && currentAudioUrl) {
            showAudioPlayer();
        } else {
            audioContainer.classList.remove('show');
        }
    }

    function showAudioPlayer() {
        if (!currentAudioUrl) return;
        if (!canPlay(currentAudioKey)) {
            playerFrame.innerHTML = '';
            limitMessageDiv.textContent = '❌ Has alcanzado el límite de 3 reproducciones. ❌';
            audioContainer.classList.add('show');
            return;
        }
        limitMessageDiv.textContent = `🎧 Te quedan ${getRemainingPlays(currentAudioKey)} reproducciones de 3. 🎧`;
        playerFrame.innerHTML = `<iframe src="https://w.soundcloud.com/player/?url=${encodeURIComponent(currentAudioUrl)}&color=%23d4af37&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false"></iframe>`;
        audioContainer.classList.add('show');
        
        const iframe = playerFrame.querySelector('iframe');
        if (iframe) {
            if (window.playCountListener) window.removeEventListener('message', window.playCountListener);
            window.playCountListener = function(event) {
                if (event.data && typeof event.data === 'string') {
                    if (event.data.includes('play')) {
                        if (canPlay(currentAudioKey)) {
                            incrementPlayCount(currentAudioKey);
                            limitMessageDiv.textContent = `🎧 Te quedan ${getRemainingPlays(currentAudioKey)} reproducciones de 3. 🎧`;
                            if (!canPlay(currentAudioKey)) {
                                playerFrame.innerHTML = '';
                                limitMessageDiv.textContent = '❌ Has alcanzado el límite de 3 reproducciones. ❌';
                            }
                        } else {
                            playerFrame.innerHTML = '';
                            limitMessageDiv.textContent = '❌ Has alcanzado el límite de 3 reproducciones. ❌';
                        }
                        window.removeEventListener('message', window.playCountListener);
                    }
                }
            };
            window.addEventListener('message', window.playCountListener);
        }
    }

    function updateResult() {
        if (currentType === 'individual') {
            let d = parseInt(dayInput.value), m = parseInt(monthInput.value), y = parseInt(yearInput.value);
            if (isNaN(d) || isNaN(m) || isNaN(y)) {
                resultNumberSpan.textContent = '—';
                resultNameSpan.textContent = 'Introduce tu fecha';
                resultLabel.textContent = 'TU DESTINO';
                audioContainer.classList.remove('show');
                return;
            }
            if (!validateDate(d, m, y)) {
                resultNumberSpan.textContent = '?';
                resultNameSpan.textContent = 'Fecha inválida';
                audioContainer.classList.remove('show');
                return;
            }
            let lifeNumber = calculateLifeNumber(d, m, y);
            currentNumber = lifeNumber;
            resultNumberSpan.textContent = lifeNumber;
            resultNameSpan.textContent = numberNames[lifeNumber] || 'Destino único';
            resultLabel.textContent = 'TU DESTINO';
        } else {
            let d1 = parseInt(day1Input.value), m1 = parseInt(month1Input.value), y1 = parseInt(year1Input.value);
            let d2 = parseInt(day2Input.value), m2 = parseInt(month2Input.value), y2 = parseInt(year2Input.value);
            if (isNaN(d1) || isNaN(m1) || isNaN(y1) || isNaN(d2) || isNaN(m2) || isNaN(y2)) {
                resultNumberSpan.textContent = '—';
                resultNameSpan.textContent = 'Introduce ambas fechas';
                resultLabel.textContent = 'VUESTRO DESTINO';
                audioContainer.classList.remove('show');
                return;
            }
            if (!validateDate(d1, m1, y1) || !validateDate(d2, m2, y2)) {
                resultNumberSpan.textContent = '?';
                resultNameSpan.textContent = 'Fecha inválida';
                audioContainer.classList.remove('show');
                return;
            }
            let n1 = calculateLifeNumber(d1, m1, y1), n2 = calculateLifeNumber(d2, m2, y2);
            let pairNumber = reduceToMaster(n1 + n2);
            currentNumber = pairNumber;
            resultNumberSpan.textContent = pairNumber;
            resultNameSpan.textContent = pairNames[pairNumber] || 'Destino único en pareja';
            resultLabel.textContent = 'VUESTRO DESTINO';
        }
        updateBuyButton();
    }

    radioIndividual.addEventListener('change', () => {
        currentType = 'individual';
        individualFields.style.display = 'flex';
        pairFields.classList.remove('show');
        resultNameSpan.textContent = 'Introduce tu fecha';
        resultNumberSpan.textContent = '—';
        resultLabel.textContent = 'TU DESTINO';
        audioContainer.classList.remove('show');
        updateResult();
    });
    
    radioPareja.addEventListener('change', () => {
        currentType = 'pareja';
        individualFields.style.display = 'none';
        pairFields.classList.add('show');
        resultNameSpan.textContent = 'Introduce ambas fechas';
        resultNumberSpan.textContent = '—';
        resultLabel.textContent = 'VUESTRO DESTINO';
        audioContainer.classList.remove('show');
        updateResult();
    });

    dayInput.addEventListener('input', updateResult);
    monthInput.addEventListener('input', updateResult);
    yearInput.addEventListener('input', updateResult);
    day1Input.addEventListener('input', updateResult);
    month1Input.addEventListener('input', updateResult);
    year1Input.addEventListener('input', updateResult);
    day2Input.addEventListener('input', updateResult);
    month2Input.addEventListener('input', updateResult);
    year2Input.addEventListener('input', updateResult);

    dayInput.addEventListener('input', () => onlyNumbers(dayInput));
    monthInput.addEventListener('input', () => onlyNumbers(monthInput));
    yearInput.addEventListener('input', () => onlyNumbers(yearInput));
    day1Input.addEventListener('input', () => onlyNumbers(day1Input));
    month1Input.addEventListener('input', () => onlyNumbers(month1Input));
    year1Input.addEventListener('input', () => onlyNumbers(year1Input));
    day2Input.addEventListener('input', () => onlyNumbers(day2Input));
    month2Input.addEventListener('input', () => onlyNumbers(month2Input));
    year2Input.addEventListener('input', () => onlyNumbers(year2Input));

    dayInput.addEventListener('input', function() { if (this.value.length === 2) monthInput.focus(); });
    monthInput.addEventListener('input', function() { if (this.value.length === 2) yearInput.focus(); });
    day1Input.addEventListener('input', function() { if (this.value.length === 2) month1Input.focus(); });
    month1Input.addEventListener('input', function() { if (this.value.length === 2) year1Input.focus(); });
    day2Input.addEventListener('input', function() { if (this.value.length === 2) month2Input.focus(); });
    month2Input.addEventListener('input', function() { if (this.value.length === 2) year2Input.focus(); });
</script>

</body>
</html>
