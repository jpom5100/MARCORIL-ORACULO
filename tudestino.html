<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuDestino - Calculadora de Número de Vida</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0d1a2a 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(20, 30, 45, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.2);
            border: 1px solid rgba(212,175,55,0.3);
        }

        .druid-image {
            text-align: center;
            margin-bottom: 30px;
        }

        .druid-placeholder {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #2a3a4a, #1a2a3a);
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d4af37;
            font-size: 60px;
        }

        h1 {
            text-align: center;
            color: #d4af37;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(212,175,55,0.3);
        }

        .subtitle {
            text-align: center;
            color: #aac8e0;
            font-size: 14px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .date-fields {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .date-field {
            flex: 1;
            min-width: 80px;
            text-align: center;
        }

        .date-field label {
            display: block;
            color: #d4af37;
            font-size: 14px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .date-field input {
            width: 100%;
            padding: 15px 10px;
            font-size: 24px;
            text-align: center;
            background: rgba(10, 20, 35, 0.9);
            border: 1px solid #d4af37;
            border-radius: 15px;
            color: white;
            font-family: monospace;
            font-weight: bold;
            transition: all 0.3s;
        }

        .date-field input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(212,175,55,0.5);
            border-color: #ffd700;
        }

        .date-field input::placeholder {
            color: #4a6075;
            font-size: 14px;
        }

        .result-container {
            text-align: center;
            padding: 25px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(212,175,55,0.3);
        }

        .result-label {
            color: #aac8e0;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .result-number {
            font-size: 72px;
            font-weight: bold;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212,175,55,0.5);
            line-height: 1;
        }

        .result-name {
            font-size: 20px;
            color: white;
            margin-top: 10px;
        }

        .audio-container {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            display: none;
        }

        .audio-container.show {
            display: block;
        }

        .audio-title {
            color: #d4af37;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        .buy-button {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #d4af37, #b8922a);
            color: #0a0f1e;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        .buy-button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(212,175,55,0.4);
        }

        .info-text {
            text-align: center;
            color: #6a8aaa;
            font-size: 12px;
            margin-top: 20px;
        }

        .note {
            font-size: 11px;
            color: #4a6075;
            text-align: center;
            margin-top: 15px;
        }

        iframe {
            width: 100%;
            height: 120px;
            border-radius: 15px;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="druid-image">
        <div class="druid-placeholder">🧙‍♂️</div>
    </div>

    <h1>✦ TUDESTINO ✦</h1>
    <div class="subtitle">¿Qué número de vida eres?</div>

    <div class="date-fields">
        <div class="date-field">
            <label>DÍA</label>
            <input type="text" id="day" placeholder="DD" maxlength="2" inputmode="numeric">
        </div>
        <div class="date-field">
            <label>MES</label>
            <input type="text" id="month" placeholder="MM" maxlength="2" inputmode="numeric">
        </div>
        <div class="date-field">
            <label>AÑO</label>
            <input type="text" id="year" placeholder="YYYY" maxlength="4" inputmode="numeric">
        </div>
    </div>

    <div class="result-container">
        <div class="result-label">TU NÚMERO DE VIDA ES</div>
        <div class="result-number" id="resultNumber">—</div>
        <div class="result-name" id="resultName">Introduce tu fecha</div>
    </div>

    <div id="audioContainer" class="audio-container">
        <div class="audio-title">🔮 ESCUCHA TU AUDIO 🔮</div>
        <div id="playerFrame"></div>
    </div>

    <a href="#" id="buyLink" class="buy-button" target="_blank">
        🔮 COMPRA VERSIÓN PAREJA POR 2€ 🔮
    </a>
    
    <div class="info-text">
        Tu número se calcula automáticamente al escribir tu fecha completa
    </div>
    <div class="note">
        Números maestros 11, 22, 33 se conservan
    </div>
</div>

<script>
    const audioLinks = {
        1: "https://soundcloud.com/jaume-674558592/1x-1",
        2: "https://soundcloud.com/jaume-674558592/2x-2",
        3: "https://soundcloud.com/jaume-674558592/3x-3",
        4: "https://soundcloud.com/jaume-674558592/4x-4",
        5: "https://soundcloud.com/jaume-674558592/5x-5",
        6: "https://soundcloud.com/jaume-674558592/6x-6",
        7: "https://soundcloud.com/jaume-674558592/7x-7",
        8: "https://soundcloud.com/jaume-674558592/8x-8",
        9: "https://soundcloud.com/jaume-674558592/9x-9"
    };

    const gumroadLink = "#";

    const numberNames = {
        1: "El Iniciador",
        2: "El Conciliador",
        3: "El Comunicador",
        4: "El Constructor",
        5: "El Aventurero",
        6: "El Cuidador",
        7: "El Buscador",
        8: "El Realizador",
        9: "El Humanitario"
    };

    const dayInput = document.getElementById('day');
    const monthInput = document.getElementById('month');
    const yearInput = document.getElementById('year');
    const resultNumberSpan = document.getElementById('resultNumber');
    const resultNameSpan = document.getElementById('resultName');
    const audioContainer = document.getElementById('audioContainer');
    const playerFrame = document.getElementById('playerFrame');
    const buyLink = document.getElementById('buyLink');

    buyLink.href = gumroadLink;

    function onlyNumbers(input) {
        input.value = input.value.replace(/[^0-9]/g, '');
    }

    function reduceToMaster(number) {
        if (number === 11 || number === 22 || number === 33) {
            return number;
        }
        while (number > 9) {
            let sum = 0;
            number.toString().split('').forEach(digit => {
                sum += parseInt(digit);
            });
            number = sum;
        }
        return number;
    }

    function reduceDatePart(part) {
        if (part === 11 || part === 22 || part === 33) {
            return part;
        }
        return reduceToMaster(part);
    }

    function calculateLifePath(day, month, year) {
        let reducedDay = reduceDatePart(day);
        let reducedMonth = reduceDatePart(month);
        let reducedYear = reduceToMaster(year);
        let sum = reducedDay + reducedMonth + reducedYear;
        let finalNumber = reduceToMaster(sum);
        if (finalNumber > 9) finalNumber = reduceToMaster(finalNumber);
        return finalNumber;
    }

    function updateResult() {
        let day = parseInt(dayInput.value);
        let month = parseInt(monthInput.value);
        let year = parseInt(yearInput.value);
        
        if (isNaN(day) || isNaN(month) || isNaN(year)) {
            resultNumberSpan.textContent = "—";
            resultNameSpan.textContent = "Introduce tu fecha completa";
            audioContainer.classList.remove('show');
            return;
        }
        
        if (day < 1 || day > 31) {
            resultNumberSpan.textContent = "?";
            resultNameSpan.textContent = "Día inválido (1-31)";
            audioContainer.classList.remove('show');
            return;
        }
        
        if (month < 1 || month > 12) {
            resultNumberSpan.textContent = "?";
            resultNameSpan.textContent = "Mes inválido (1-12)";
            audioContainer.classList.remove('show');
            return;
        }
        
        if (year < 1000 || year > 2100) {
            resultNumberSpan.textContent = "?";
            resultNameSpan.textContent = "Año inválido (1000-2100)";
            audioContainer.classList.remove('show');
            return;
        }
        
        const daysInMonth = new Date(year, month, 0).getDate();
        if (day > daysInMonth) {
            resultNumberSpan.textContent = "?";
            resultNameSpan.textContent = `El mes ${month} solo tiene ${daysInMonth} días`;
            audioContainer.classList.remove('show');
            return;
        }
        
        const lifeNumber = calculateLifePath(day, month, year);
        
        resultNumberSpan.textContent = lifeNumber;
        resultNameSpan.textContent = numberNames[lifeNumber] || "Destino único";
        
        if (audioLinks[lifeNumber]) {
            const soundcloudUrl = audioLinks[lifeNumber];
            playerFrame.innerHTML = `<iframe width="100%" height="120" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(soundcloudUrl)}&color=%23d4af37&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false"></iframe>`;
            audioContainer.classList.add('show');
        } else {
            audioContainer.classList.remove('show');
        }
    }

    dayInput.addEventListener('input', updateResult);
    monthInput.addEventListener('input', updateResult);
    yearInput.addEventListener('input', updateResult);

    dayInput.addEventListener('input', () => onlyNumbers(dayInput));
    monthInput.addEventListener('input', () => onlyNumbers(monthInput));
    yearInput.addEventListener('input', () => onlyNumbers(yearInput));
    
    dayInput.addEventListener('input', function() {
        if (this.value.length === 2) monthInput.focus();
    });
    
    monthInput.addEventListener('input', function() {
        if (this.value.length === 2) yearInput.focus();
    });
</script>

</body>
</html>
